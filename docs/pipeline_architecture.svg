<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 716" width="500" height="716">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .bx    { fill:#ffffff; stroke:#111111; stroke-width:1.1; }
      .dbx   { fill:none; stroke:#111111; stroke-width:1; stroke-dasharray:4 3; }
      .ln    { stroke:#111111; stroke-width:1.1; fill:none; }
      .dln   { stroke:#111111; stroke-width:1; fill:none; stroke-dasharray:4 3; }
      text   { font-family:'FreeSans','Helvetica Neue',Helvetica,Arial,sans-serif; fill:#111111; }
      .t1    { font-size:13px; font-weight:700; text-anchor:middle; }
      .t2    { font-size:11.5px; font-weight:700; text-anchor:middle; }
      .sub   { font-size:7.2px; fill:#6b6b6b; text-anchor:middle; }
      .jlab  { font-size:8px; font-weight:700; }
      .side  { font-size:7.6px; font-weight:700; text-anchor:middle; }
      .mono  { font-size:5.4px; fill:#3a3a3a; text-anchor:middle; letter-spacing:0.15px; }
      .mlist { font-size:6.6px; fill:#3a3a3a; text-anchor:middle; }
      .note  { font-size:5.6px; fill:#7a7a7a; font-style:italic; text-anchor:middle; }
      .edge  { font-size:6.6px; fill:#3a3a3a; }
    </style>
  </defs>

  <rect x="0" y="0" width="500" height="716" fill="#ffffff"/>

  <!-- Developer -->
  <rect class="bx" x="163" y="12" width="175" height="48" rx="1"/>
  <text class="t1" x="250.5" y="34">Developer</text>
  <text class="sub" x="250.5" y="47">git commit &amp; push</text>

  <line class="ln" x1="250.5" y1="60" x2="250.5" y2="78" marker-end="url(#arrow)"/>

  <!-- GitHub repository -->
  <rect class="bx" x="163" y="80" width="175" height="48" rx="1"/>
  <text class="t1" x="250.5" y="102">GitHub repository</text>
  <text class="sub" x="250.5" y="115">triggers workflow on push to main</text>

  <line class="ln" x1="250.5" y1="128" x2="250.5" y2="148" marker-end="url(#arrow)"/>

  <!-- Pipeline outer box -->
  <rect class="dbx" x="72" y="150" width="406" height="440"/>
  <text class="t1" x="275" y="174">GitHub Actions pipeline</text>
  <text class="sub" x="275" y="187">cicd.yml — three jobs</text>

  <!-- build-test job -->
  <rect class="dbx" x="155" y="200" width="190" height="178"/>
  <text class="jlab" x="161" y="213">build-test</text>

  <rect class="bx" x="165" y="220" width="170" height="44" rx="1"/>
  <text class="t2" x="250" y="241">Lint</text>
  <text class="sub" x="250" y="253">static checks</text>

  <line class="ln" x1="250" y1="264" x2="250" y2="274" marker-end="url(#arrow)"/>

  <rect class="bx" x="165" y="276" width="170" height="44" rx="1"/>
  <text class="t2" x="250" y="297">Build</text>
  <text class="sub" x="250" y="309">compile</text>

  <line class="ln" x1="250" y1="320" x2="250" y2="330" marker-end="url(#arrow)"/>

  <rect class="bx" x="165" y="332" width="170" height="44" rx="1"/>
  <text class="t2" x="250" y="353">Test</text>
  <text class="sub" x="250" y="365">unit / integration</text>

  <!-- job to job -->
  <line class="ln" x1="250" y1="378" x2="250" y2="394" marker-end="url(#arrow)"/>

  <!-- containerise-deploy job -->
  <rect class="dbx" x="155" y="396" width="190" height="178"/>
  <text class="jlab" x="161" y="409">containerise-deploy</text>

  <rect class="bx" x="165" y="414" width="170" height="44" rx="1"/>
  <text class="t2" x="250" y="435">Containerise</text>
  <text class="sub" x="250" y="447">Docker image → ghcr.io</text>

  <line class="ln" x1="250" y1="458" x2="250" y2="468" marker-end="url(#arrow)"/>

  <rect class="bx" x="165" y="470" width="170" height="44" rx="1"/>
  <text class="t2" x="250" y="491">Deploy</text>
  <text class="sub" x="250" y="503">trigger deploy hook</text>

  <line class="ln" x1="250" y1="514" x2="250" y2="524" marker-end="url(#arrow)"/>

  <rect class="bx" x="165" y="526" width="170" height="44" rx="1"/>
  <text class="t2" x="250" y="547">Verify live</text>
  <text class="sub" x="250" y="559">poll /health until fresh container</text>

  <!-- secrets & variables -->
  <rect class="dbx" x="84" y="456" width="64" height="66"/>
  <text class="side" x="116" y="466">secrets &amp;</text>
  <text class="side" x="116" y="476">variables</text>
  <text class="mono" x="116" y="490">DEPLOY_HOOK_URL</text>
  <text class="mono" x="116" y="499">SERVICE_URL</text>
  <text class="mono" x="116" y="508">GITHUB_TOKEN</text>
  <line class="dln" x1="148" y1="492" x2="163" y2="492" marker-end="url(#arrow)"/>

  <!-- record-metrics -->
  <rect class="dbx" x="358" y="432" width="112" height="118"/>
  <text class="side" x="414" y="455" style="font-size:9px">record-metrics</text>
  <text class="note" x="414" y="466" style="font-size:6.4px">(if: always())</text>
  <text class="mlist" x="414" y="484">deployment success</text>
  <text class="mlist" x="414" y="494">execution time</text>
  <text class="mlist" x="414" y="504">config footprint</text>
  <text class="mlist" x="414" y="514">cold start</text>
  <text class="mlist" x="414" y="531" style="font-weight:700">→ metrics.csv</text>
  <line class="dln" x1="345" y1="492" x2="356" y2="492" marker-end="url(#arrow)"/>

  <!-- pass / fail feedback loop -->
  <path class="dln" d="M 155 290 L 40 290 L 40 36 L 161 36" marker-end="url(#arrow)"/>
  <text class="edge" x="34" y="200" text-anchor="middle"
        transform="rotate(-90 34 200)">pass / fail feedback</text>

  <!-- pipeline to host -->
  <line class="ln" x1="205" y1="574" x2="205" y2="642" marker-end="url(#arrow)"/>
  <text class="edge" x="199" y="600" text-anchor="end">deploy hook</text>

  <line class="ln" x1="295" y1="642" x2="295" y2="574" marker-end="url(#arrow)"/>
  <text class="edge" x="301" y="600">GET /health</text>

  <!-- Cloud host -->
  <g transform="translate(99.2 268.8) scale(0.60)">
    <path class="bx" d="M 172 722
      C 150 722 138 708 142 692
      C 130 680 136 660 154 656
      C 156 636 178 626 196 636
      C 206 616 238 612 254 628
      C 270 616 298 620 306 640
      C 330 636 350 652 346 672
      C 362 680 362 706 344 716
      C 338 722 330 722 324 722 Z"/>
  </g>
  <text class="t1" x="248" y="667" style="font-size:10.5px">Cloud host</text>
  <text class="sub" x="248" y="678" style="font-size:6.4px">Render</text>
</svg>
